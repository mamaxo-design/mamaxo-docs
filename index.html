<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>mamaXO Document Factory — form (mockup)</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#E2681A;--ink:#2B2B2D;--muted:rgba(43,43,45,.56);--paper:#FBF7F0;--panel:#F1E9DC;--line:#E7DCC9;--pos:#4F8A54;
--fd:'Archivo','Poppins','Segoe UI',system-ui,sans-serif;--ft:'Inter','Lato','Segoe UI',system-ui,sans-serif;--serif:'Lora','Georgia','Times New Roman',serif;}
*{box-sizing:border-box}body{margin:0;background:#EFE7DA;color:var(--ink);font-family:var(--ft);font-size:14px;line-height:1.5}
.app{max-width:1080px;margin:0 auto;min-height:100vh;background:var(--paper);box-shadow:0 0 40px rgba(0,0,0,.06)}
.grad{height:6px;background:linear-gradient(90deg,#F5E2C8,#EFC99B,#EBAA69,#E88D3E,#E2681A,#C15815)}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;border-bottom:1px solid var(--line)}
.top .l{display:flex;align-items:center;gap:14px}.top img.logo{height:26px}
.top .tag{font-family:var(--fd);font-weight:700;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:14px}
.top .line{font-family:var(--fd);font-weight:700;font-size:11px;color:#fff;background:var(--brand);padding:4px 11px;border-radius:20px;display:none}
.top .r{display:flex;align-items:center;gap:14px}
.uilang{display:flex;border:1.5px solid var(--line);border-radius:20px;overflow:hidden}
.uilang button{border:0;background:#fff;color:var(--muted);font-family:var(--fd);font-weight:700;font-size:11px;padding:5px 10px;cursor:pointer}
.uilang button.on{background:var(--brand);color:#fff}
.user{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
.user .av{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:12px}
.wrap{display:flex;min-height:560px}
.rail{width:230px;flex:none;border-right:1px solid var(--line);padding:22px 14px}
.step{display:flex;gap:11px;align-items:flex-start;padding:10px 10px;border-radius:9px;cursor:pointer;color:var(--muted)}
.step .n{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:12px;background:#fff}
.step.on{background:var(--panel);color:var(--ink)}.step.on .n{background:var(--brand);border-color:var(--brand);color:#fff}
.step.done .n{background:var(--pos);border-color:var(--pos);color:#fff}.step.skip{opacity:.35}
.step b{font-family:var(--fd);font-weight:700;font-size:13px;display:block}.step small{font-size:11px}
.main{flex:1;padding:28px 32px;min-width:0}h1.title{font-family:var(--fd);font-weight:800;font-size:22px;margin:0 0 4px}.subtitle{color:var(--muted);margin:0 0 22px}
.types{display:flex;gap:14px;flex-wrap:wrap}
.tcard{flex:1 1 30%;min-width:150px;border:1.5px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;background:#fff;transition:.12s}
.tcard:hover{border-color:#E8C79F}.tcard.sel{border-color:var(--brand);box-shadow:0 0 0 3px #FBEEDF}
.tcard .ico{font-size:22px}.tcard h3{font-family:var(--fd);font-weight:700;font-size:14.5px;margin:9px 0 4px}.tcard p{margin:0;font-size:12px;color:var(--muted)}
.lines{display:flex;gap:16px}
.lcard{flex:1;border:1.5px solid var(--line);border-radius:14px;padding:24px;cursor:pointer;background:#fff;transition:.12s}
.lcard:hover{border-color:#E8C79F}.lcard.sel{border-color:var(--brand);box-shadow:0 0 0 3px #FBEEDF}
.lcard .bg{font-family:var(--serif);font-weight:600;font-size:19px;margin:6px 0 6px}.lcard p{margin:0;font-size:12.5px;color:var(--muted)}
.lcard .pin{display:inline-block;font-family:var(--fd);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.field{margin-bottom:15px}.field label{display:block;font-family:var(--fd);font-weight:600;font-size:12px;margin-bottom:5px}
.field .lock{float:right;font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-family:var(--ft);font-size:13.5px;background:#fff;color:var(--ink)}
.field textarea{min-height:60px;resize:vertical}.field.locked input{background:var(--panel);color:var(--muted)}
.row{display:flex;gap:14px}.row .field{flex:1}.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.filters{display:flex;gap:12px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap}.filters .field{margin:0}
.selbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)}.selbar b{color:var(--brand);font-family:var(--fd)}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ptile{display:flex;gap:11px;border:1.5px solid var(--line);border-radius:11px;padding:9px;background:#fff;cursor:pointer;transition:.12s}
.ptile.sel{border-color:var(--brand);box-shadow:0 0 0 3px #FBEEDF}.ptile.hide{display:none}
.ptile img{width:60px;height:60px;flex:none;object-fit:cover;border-radius:8px;background:var(--panel)}
.ptile .loc{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.ptile h4{font-family:var(--fd);font-weight:700;font-size:13px;margin:2px 0}
.ptile .pr{font-family:var(--fd);font-weight:800;color:var(--brand);font-size:13.5px}.ptile .st{font-size:10px;color:var(--muted)}
.ck{margin-left:auto;width:20px;height:20px;flex:none;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;color:#fff;font-size:12px}.ptile.sel .ck{background:var(--brand);border-color:var(--brand)}
.ends{display:flex;flex-direction:column;gap:12px}
.echk{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;background:#fff;cursor:pointer}
.echk.sel{border-color:var(--brand);box-shadow:0 0 0 3px #FBEEDF}
.echk .bx{width:22px;height:22px;flex:none;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;color:#fff}.echk.sel .bx{background:var(--brand);border-color:var(--brand)}
.echk b{font-family:var(--fd);font-weight:700;font-size:13.5px}.echk small{color:var(--muted)}
.pvariants{display:flex;gap:12px;margin-top:6px}
.pvar{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:10px;cursor:pointer;text-align:center;background:#fff;font-family:var(--fd);font-weight:700;font-size:12.5px}
.pvar.sel{border-color:var(--brand);box-shadow:0 0 0 3px #FBEEDF}.pvar .sw{height:46px;border-radius:8px;margin-bottom:7px}
.nav{display:flex;justify-content:space-between;padding:18px 32px;border-top:1px solid var(--line);background:#fff}
.btn{font-family:var(--fd);font-weight:700;font-size:13.5px;border-radius:10px;padding:11px 20px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.ghost{visibility:hidden}
.pv{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.pv .cov{background:var(--paper)}.pv .cov .g{height:8px;background:linear-gradient(90deg,#F5E2C8,#EFC99B,#EBAA69,#E88D3E,#E2681A,#C15815)}
.pv .cov .cin{padding:18px 24px 0;display:flex;justify-content:space-between;align-items:flex-start}.pv .cov img.lg{height:20px}.pv .cov img.bd{height:30px}
.pv .cov .kick{color:var(--brand);font-family:var(--fd);font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:14px 24px 0}
.pv .cov .tt{font-family:var(--serif);font-weight:700;font-size:25px;padding:2px 24px 0;max-width:17ch}
.pv .cov .rl{height:3px;width:54px;background:var(--brand);margin:12px 24px;border-radius:2px}
.pv .cov .mt{display:flex;gap:26px;padding:2px 24px 18px;color:var(--muted);font-size:11px}.pv .cov .mt b{display:block;color:var(--ink);font-family:var(--fd);font-size:12px}
.pv .body{padding:18px 24px}.pv .kpis{display:flex;gap:10px;margin:0 0 12px}.pv .kpi{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px}
.pv .kpi .kn{font-family:var(--fd);font-weight:800;font-size:18px}.pv .kpi .kn i{color:var(--brand);font-style:normal;font-size:11px}.pv .kpi .kd{font-size:10.5px;color:var(--muted);margin-top:3px}
.pv .pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pv .pc{border:1px solid var(--line);border-radius:10px;overflow:hidden}.pv .pc img{width:100%;height:64px;object-fit:cover;display:block}
.pv .pc .pcb{padding:7px 10px}.pv .pc .loc{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.pv .pc h5{font-family:var(--serif);font-weight:600;margin:2px 0;font-size:12px}.pv .pc .pr{font-family:var(--fd);font-weight:800;color:var(--brand);font-size:12px}
.pv p.para{font-size:12.5px;margin:.5em 0}
.endstrip{display:flex;gap:8px;padding:12px 24px 16px;flex-wrap:wrap}
.endstrip .e{border:1px solid var(--line);border-radius:8px;overflow:hidden;width:118px}
.endstrip .e .h{font-family:var(--fd);font-weight:700;font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
.endstrip .e .mini{height:66px;padding:8px;font-size:8px;color:var(--muted)}.endstrip .e.about .mini{background:#fff}
.endstrip .e.svc .mini,.endstrip .e.plate .mini{background:var(--brand);color:#fff;font-family:var(--serif);display:flex;align-items:center;justify-content:center;text-align:center}
.endstrip .e.plate.photo .mini{background:#2B2B2D center/cover}
.pvfoot{background:var(--paper);border-top:1px solid var(--line);padding:12px 24px;font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 20px;border-radius:11px;font-family:var(--fd);font-weight:600;font-size:13.5px;display:none;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast .d{width:9px;height:9px;border-radius:50%;background:var(--pos)}
</style></head><body>

 else if(S.step===5){h+=`<h1 class="title">${l.s5t}</h1><p class="subtitle">${l.s5s}</p>`;h+=`<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px"><span style="font-family:var(--fd);font-weight:700;font-size:12.5px">${CT[ui].fmt}:</span><button class="pvar ${S.format=='pdf'?'sel':''}" style="flex:0 0 auto;padding:8px 18px" onclick="S.format='pdf';render()">PDF</button><button class="pvar ${S.format=='docx'?'sel':''}" style="flex:0 0 auto;padding:8px 18px" onclick="S.format='docx';render()">Word</button></div>`;h+=renderPreview();}
 document.getElementById('main').innerHTML=h;}
function renderPreview(){const l=L();const pr=PROFILES[S.line];const title=S.fields.title||(isCat()?'Athens portfolio up to €250,000':(S.type==='custom'&&S.typeCustom?S.typeCustom:(l.types[S.type]?l.types[S.type][0]:'')));
 let body="";if(isCat()){const chosen=[...S.sel].map(i=>PROPS[i]);const list=chosen.length?chosen:PROPS.slice(0,4);body=`<div class="pg">`+list.map(p=>`<div class="pc"><img src="${ASSETS[p.img]}"><div class="pcb"><div class="loc">${p.loc}</div><h5>${p.n}</h5><div class="pr">from €${p.price.toLocaleString('en-US')}</div></div></div>`).join('')+`</div>`;}
 else{var secs=S.sections.filter(function(x){return x.title||x.text});body=(S.fields.lead?`<p class="para" style="font-size:13px;color:var(--muted)">${escT(S.fields.lead)}</p>`:'')+(secs.length?secs.map(function(x){return `<h5 style="font-family:var(--serif);font-weight:600;font-size:14px;margin:10px 0 3px">${escT(x.title)||'—'}</h5><p class="para" style="margin:0;color:var(--muted)">${escT((x.text||'').split(String.fromCharCode(10))[0])}</p>`}).join(''):`<p class="para" style="opacity:.5">Add sections in “Details”…</p>`);}
 let strip="";if(S.ends.about)strip+=`<div class="e about"><div class="h">${l.pAbout}</div><div class="mini">Why mamaXO</div></div>`;if(S.ends.svc)strip+=`<div class="e svc"><div class="h">${l.pSvc}</div><div class="mini">We stay with you</div></div>`;
 strip+=`<div class="e plate ${S.ends.plate=='photo'?'photo':''}"><div class="h">${l.pContacts} · ${S.ends.plate=='photo'?l.vPhoto:l.vOrange}</div><div class="mini" ${S.ends.plate=='photo'?`style="background-image:url('${ASSETS.P4}')"`:''}>${(pr.title.split('·')[1]||'').trim()}</div></div>`;
 return `<div class="pv"><div class="cov"><div class="g"></div><div class="cin"><img class="lg" src="${ASSETS.LOGO}"><img class="bd" src="${ASSETS.BADGE}"></div><div class="kick">${pr.kick}</div><div class="tt">${title}</div><div class="rl"></div><div class="mt"><div><span>${l.pClient}</span><b>${S.fields.client||'—'}</b></div><div><span>${l.pDate}</span><b>${S.fields.date}</b></div><div><span>${l.pRef}</span><b>${S.fields.ref||'—'}</b></div></div></div><div class="body">${body}</div><div style="padding:0 24px"><div style="font-family:var(--fd);font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)">${l.pEnd}</div></div><div class="endstrip">${strip}</div><div class="pvfoot"><span>${pr.title.replace('mamaXO · ','')} · ${pr.email} · ${pr.phone}</span><span>${S.lang.toUpperCase()} · © 2026 mamaXO … I.K.E.</span></div></div>`;}
function pickLine(k){S.line=k;render()}function pick(k){S.type=k;render()}function tog(i){S.sel.has(i)?S.sel.delete(i):S.sel.add(i);renderMain();renderRail();}
function go(d){if(d>0){if(S.step===0&&!S.line)return;if(S.step===1&&!S.type)return;if(S.step===2&&!isCat()){S.step=4;}else if(S.step===5){submitDoc();return;}else S.step++;}else{if(S.step===4&&!isCat()){S.step=2;}else S.step=Math.max(0,S.step-1);}reached=Math.max(reached,S.step);render();}
const CT={en:{sec:'Document content — sections',st:'Section heading',sb:'Section text',sbph:'Type the content of this section. Press Enter for a new paragraph.',add:'Add section',fmt:'Output format'},ru:{sec:'Содержание документа — разделы',st:'Заголовок раздела',sb:'Текст раздела',sbph:'Впиши содержание раздела. Enter — новый абзац.',add:'Добавить раздел',fmt:'Формат файла'},tr:{sec:'Belge içeriği — bölümler',st:'Bölüm başlığı',sb:'Bölüm metni',sbph:'Bu bölümün içeriğini yazın. Yeni paragraf için Enter.',add:'Bölüm ekle',fmt:'Dosya biçimi'}};function escA(s){return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}function escT(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}function addSection(){S.sections.push({title:'',text:''});renderMain();}function rmSection(i){S.sections.splice(i,1);if(!S.sections.length)S.sections.push({title:'',text:''});renderMain();}function submitDoc(){const payload={line:S.line,type:S.type,typeCustom:S.typeCustom,title:S.fields.title,client:S.fields.client,date:S.fields.date,ref:S.fields.ref,lang:S.lang,lead:S.fields.lead,sections:S.sections,format:S.format,selected:[...S.sel],ends:S.ends};const btn=document.getElementById('next');const old=btn.innerText;btn.innerText='…';btn.disabled=true;fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(r=>{if(!r.ok)throw 0;return r.blob();}).then(b=>{const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=((S.fields.client||'document').replace(/\s+/g,'_'))+'_'+S.type+(S.format==='docx'?'.docx':'.pdf');document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);document.getElementById('toasttext').innerText=a.download+' — '+L().toast;const t=document.getElementById('toast');t.style.display='flex';setTimeout(()=>t.style.display='none',3600);}).catch(()=>{alert('Generation failed — check you are signed in.');}).finally(()=>{btn.innerText=old;btn.disabled=false;});}
function render(){renderTop();renderRail();renderMain();document.getElementById('back').style.visibility=S.step===0?'hidden':'visible';document.getElementById('back').innerText=L().back;document.getElementById('next').innerText=S.step===5?(S.format==='docx'?'Generate Word ✓':L().gen):L().next;const lc=document.getElementById('linechip');if(S.line){lc.style.display='inline-block';lc.innerText=PROFILES[S.line].name;}else lc.style.display='none';}
render();
</script></body></html>
