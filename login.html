<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>mamaXO Document Factory — sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Archivo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#E2681A;--ink:#2B2B2D;--muted:rgba(43,43,45,.56);--paper:#FBF7F0;--line:#E7DCC9}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:grid;place-items:center;background:#EFE7DA;
  font-family:'Inter','Segoe UI',system-ui,sans-serif;color:var(--ink)}
.card{width:360px;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.10)}
.grad{height:8px;background:linear-gradient(90deg,#F5E2C8,#EFC99B,#EBAA69,#E88D3E,#E2681A,#C15815)}
.bd{padding:30px 28px 28px}
.eyebrow{font-family:'Archivo',sans-serif;font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--brand)}
h1{font-family:'Lora',Georgia,serif;font-weight:700;font-size:22px;margin:6px 0 18px}
label{display:block;font-family:'Archivo',sans-serif;font-weight:600;font-size:12px;margin-bottom:6px}
input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;background:#fff}
button{width:100%;margin-top:16px;background:var(--brand);color:#fff;border:0;border-radius:10px;
  font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;padding:12px;cursor:pointer}
.err{color:#B23A2E;font-size:12.5px;margin-top:10px}
.hint{color:var(--muted);font-size:11.5px;margin-top:14px}
</style>
</head>
<body>
<div class="card"><div class="grad"></div><div class="bd">
  <div class="eyebrow">Document Factory</div>
  <h1>Sign in</h1>
  <form method="post">
    <label>Team password</label>
    <input type="password" name="password" autofocus autocomplete="current-password">
    <button type="submit">Enter</button>
    {% if error %}<div class="err">Wrong password — try again.</div>{% endif %}
  </form>
  <div class="hint">Shared team access · mamaXO</div>
</div></div>
</body>
</html>
